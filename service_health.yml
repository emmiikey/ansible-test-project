---
- name: Manage Linux service health
  hosts: managed_servers
  become: true

  tasks:
    # Package Installation
    - name: Install required packages
      ansible.builtin.import_tasks: tasks/install_packages.yml

    # Service Management
    - name: Manage service states
      ansible.builtin.import_tasks: tasks/manage_services.yml

    # Service Health Validation
    - name: Validate service health
      ansible.builtin.import_tasks: tasks/health_checks.yml

    # Zombie Process Detection
    - name: Check for zombie processes
      ansible.builtin.import_tasks: tasks/zombie_check.yml
